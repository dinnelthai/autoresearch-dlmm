name: Historical dataset offline checks
on:
  push:
    branches: ['research/historical-data']
    paths:
      - 'research/history/**'
      - '.github/workflows/historical-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/history/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyarrow==19.0.1'
      - run: python -m unittest discover -s research/history -p 'test_build_dataset.py' -v
