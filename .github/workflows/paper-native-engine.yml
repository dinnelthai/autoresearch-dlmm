name: Paper native engine acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-native-engine.yml'
      - 'research/engine.mjs'
      - 'research/engine/**'
      - 'research/engine-*.mjs'
      - 'research/test.mjs'
      - 'research/integer.mjs'
      - 'research/live/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-native-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Record runtime and revision
        run: |
          node --version
          git rev-parse HEAD
          git status --porcelain
      - name: Native engine and paper lifecycle tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            research/test.mjs \
            research/engine-exit.test.mjs \
            research/engine-guard.test.mjs \
            research/engine-liquidity.test.mjs \
            research/engine-parity.test.mjs \
            research/engine-path-risk.test.mjs \
            research/engine-rebalance.test.mjs \
            research/engine-volume.test.mjs \
            research/live/engine-input.test.mjs \
            research/live/preview-management.test.mjs \
            research/live/paper-adaptive-core.test.mjs \
            research/live/paper-snapshot-run-core.test.mjs \
            research/live/paper-core.test.mjs \
            research/live/paper-event-core.test.mjs \
            research/live/paper-interval-core.test.mjs | tee native-engine.tap
      - name: Retain test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-tap
          path: native-engine.tap
          if-no-files-found: warn
          retention-days: 7
  native-paper-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Real service on disposable filesystem
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            research/live/terminal-paper-service.test.mjs \
            research/live/local-http-probe.test.mjs \
            research/live/paper-snapshot.test.mjs \
            research/live/paper-auto-core.test.mjs \
            research/live/paper-router-http.test.mjs \
            research/live/terminal-router.test.mjs \
            research/live/paper-pool-manager.test.mjs \
            research/live/terminal-ui.test.mjs \
            research/live/research-input-status.test.mjs \
            research/live/state-core.test.mjs \
            research/live/source-inventory.test.mjs \
            research/live/paper-history-store.test.mjs \
            research/live/paper-history-fs.test.mjs \
            research/live/research-snapshot.test.mjs \
            research/live/research-replay.test.mjs \
            research/live/review-core.test.mjs \
            research/live/wallet-evidence-core.test.mjs \
            research/live/research-catalog.test.mjs | tee native-paper-service.tap
      - name: Retain service output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-paper-service-tap
          path: native-paper-service.tap
          if-no-files-found: warn
          retention-days: 7
