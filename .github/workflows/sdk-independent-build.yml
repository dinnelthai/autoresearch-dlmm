name: Pinned SDK independent build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdk-independent-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/vendor data/acceptance
          git init -q data/vendor/dlmm-sdk
          git -C data/vendor/dlmm-sdk remote add origin https://github.com/MeteoraAg/dlmm-sdk.git
          git -C data/vendor/dlmm-sdk fetch --depth 1 origin 1532e540db41ac405dbf4c5bb2ddfceaa1f98ff1
          git -C data/vendor/dlmm-sdk checkout --detach FETCH_HEAD
          cd data/vendor/dlmm-sdk
          test "$(git rev-parse HEAD)" = 1532e540db41ac405dbf4c5bb2ddfceaa1f98ff1
          test -z "$(git status --porcelain)"
          test "$(git hash-object ts-client/package.json)" = 6b0040e267f19f7dffa287b6768e5a660f6087cb
          test "$(git hash-object ts-client/pnpm-lock.yaml)" = 8c589f3f8f595f12ad930a407863b933df7dc6cb
          test "$(git hash-object ts-client/pnpm-workspace.yaml)" = 7177be995327f3f2fc77ca128020a72cb084bbfa
          test "$(git hash-object ts-client/src/dlmm/idl/idl.json)" = 6715f5cf19dffa8651a185ac0dd823218c6a2a75
          test "$(git hash-object ts-client/tsup.config.ts)" = ac58e23edc91a079dacc429e8a7b905964029c63
      - name: Build pinned SDK without install lifecycle scripts
        shell: bash
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.33.1
          test "$(pnpm --version)" = 10.33.1
          cd data/vendor/dlmm-sdk/ts-client
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          git diff --exit-code
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/data/vendor"
      - name: Verify artifact identity before consumer install
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const file='data/vendor/meteora-ag-dlmm-1.9.15.tgz';
          const sha256=b=>createHash('sha256').update(b).digest('hex');
          const bytes=readFileSync(file);
          const expected='7e8da2ee2e528a5aba4c1efd3909dcd74ac94cfed380fa9636f256ade1a41b3b';
          const actual=sha256(bytes);
          const integrity='sha512-'+createHash('sha512').update(bytes).digest('base64');
          const lock=readFileSync('research/live/package-lock.json');
          const expectedLock='dad5c239e5da6b8bb3efe2a59de814a234fd2b1b16fee347f9e96c361b2bd197';
          const lockHash=sha256(lock);
          const entry=JSON.parse(lock).packages['node_modules/@meteora-ag/dlmm'];
          const exact=actual===expected&&lockHash===expectedLock&&entry?.integrity===integrity;
          const report={scope:'INDEPENDENT_SDK_BUILD_ONLY',node:process.version,platform:process.platform,arch:process.arch,expected,actual,integrity,expectedLock,lockHash,exact,liveAcceptance:false};
          writeFileSync('data/acceptance/sdk-independent-build.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          if(!exact)process.exitCode=1;
          JS
      - name: Install unchanged consumer lock and verify project adapter
        id: consumer-install
        shell: bash
        run: |
          set -euo pipefail
          (cd research/live && npm ci --ignore-scripts --no-audit --no-fund)
          node --test research/live/sdk-runtime.test.mjs
          git diff --exit-code -- research/live/package.json research/live/package-lock.json
      - name: Record fresh consumer audit without applying fixes
        id: consumer-audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd research/live && npm audit --omit=dev --ignore-scripts --json) > data/acceptance/sdk-consumer-audit-ci.json
          rc=$?
          set -e
          AUDIT_EXIT="$rc" node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const audit=JSON.parse(readFileSync('data/acceptance/sdk-consumer-audit-ci.json','utf8'));
          const valid=!audit.error&&typeof audit.metadata?.vulnerabilities==='object';
          const result={scope:'DEPENDENCY_AUDIT_ONLY',exitCode:Number(process.env.AUDIT_EXIT),valid,counts:valid?audit.metadata.vulnerabilities:null,advisories:valid?Object.values(audit.vulnerabilities??{}).flatMap(v=>v.via.filter(x=>typeof x==='object').map(x=>({name:x.name,severity:x.severity,source:x.source,url:x.url}))).filter((x,i,a)=>a.findIndex(y=>y.source===x.source)===i):[],securityReviewComplete:false,liveAcceptance:false};
          writeFileSync('data/acceptance/sdk-consumer-audit-summary.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          if(!valid)process.exitCode=1;
          JS
      - name: Run full offline verifier using verified original SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 5dc94379869fe3dbb28bbaa88222f2f68ed5d479:research/engine.mjs)" = 2da429e85e32abb54dfd9d2705a6654304d652b6
          set +e
          node research/live/verify-offline.mjs
          rc=$?
          set -e
          node --input-type=module <<'JS'
          import {readdirSync,readFileSync} from 'node:fs';
          const path=readdirSync('data/acceptance').filter(x=>/^offline-\d+\.json$/.test(x)).sort().at(-1);
          if(path){const r=JSON.parse(readFileSync('data/acceptance/'+path,'utf8'));for(const f of r.records.filter(x=>x.status!=='PASS'))console.log(JSON.stringify({id:f.id,status:f.status,exitCode:f.exitCode,error:f.error,tapError:f.tapError,stdout:f.stdout?.slice(0,2500),stderr:f.stderr?.slice(0,1000)}))}
          JS
          exit "$rc"
      - name: Start actual terminal process with empty local evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/live
          test ! -e data/paper-auto
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s\n' '{"pool":"EXWUUH9Au6XimBjgaJ5RxP1ZfWz6JVxzjs8cNRyyxLNr","monitoring":{"enabled":false},"dynamicCapture":{"enabled":false},"walletEvidence":{"enabled":false}}' > "$config"
          SOLANA_RPC_URL=http://127.0.0.1:1 node research/live/terminal-server.mjs --config "$config" --port 8790 > data/acceptance/terminal-process-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -f "$config"' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 1 http://127.0.0.1:8790/health > /dev/null; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat data/acceptance/terminal-process-smoke.log; exit 1; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const origin='http://127.0.0.1:8790';
          const get=async path=>{const r=await fetch(origin+path,{signal:AbortSignal.timeout(5000)});assert.equal(r.status,200,path);return r.json()};
          const health=await get('/health');
          assert.equal(health.status,'RUNNING');assert.equal(health.apiVersion,'flow-data-v12');
          assert.equal(health.pool,'EXWUUH9Au6XimBjgaJ5RxP1ZfWz6JVxzjs8cNRyyxLNr');
          assert.equal(health.executionReady,false);
          const html=await fetch(origin+'/',{signal:AbortSignal.timeout(5000)});
          assert.equal(html.status,200);
          const markup=Buffer.from(await html.arrayBuffer());
          const {createHash}=await import('node:crypto');
          assert.equal(createHash('sha256').update(markup).digest('hex'),health.htmlHash,'Served HTML differs from startup fingerprint');
          assert.ok(markup.toString('utf8').includes('<title>Flow · DLMM Terminal</title>'),'Terminal title missing');
          const css=await fetch(origin+'/assets/terminal.css',{signal:AbortSignal.timeout(5000)});
          assert.equal(css.status,200);assert.ok((await css.arrayBuffer()).byteLength>0,'Terminal CSS empty');
          const state=await get('/api/terminal/state');
          assert.equal(state.status,'BLOCKED');assert.deepEqual(state.gaps,['STATE_UNAVAILABLE']);assert.equal(state.reviewGate?.reason,'STATE_UNAVAILABLE');assert.equal(state.market,null);assert.equal(state.decisionReady,false);assert.equal(state.executionReady,false);
          const paper=await get('/api/terminal/paper-status');
          assert.equal(paper.status,'NO_EXPERIMENT');assert.equal(paper.running,false);assert.equal(paper.pnlReady,false);
          const pools=await get('/api/terminal/paper-pools');assert.equal(pools.pools.length,1);assert.equal(pools.pools[0].pool,health.pool);
          const report={scope:'ACTUAL_TERMINAL_PROCESS_EMPTY_EVIDENCE_ONLY',health:health.status,apiVersion:health.apiVersion,state:state.status,paper:paper.status,poolCount:pools.pools.length,liveAcceptance:false,executionReady:false};
          writeFileSync('data/acceptance/terminal-process-smoke.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          JS
          kill -TERM "$pid"
          wait "$pid"
      - name: Verify required direct ESM contract without fallback
        id: direct-esm
        if: ${{ always() && steps['consumer-install'].outcome == 'success' }}
        working-directory: research/live
        run: |
          node --input-type=module -e 'import DLMM,* as sdk from "@meteora-ag/dlmm"; for(const k of ["createProgram","wrapPosition","getBinArrayIndexesCoverage","deriveBinArray","deriveBinArrayBitmapExtension","getBinArrayLowerUpperBinId","deriveEventAuthority","binIdToBinArrayIndex","toWeightDistribution","toAmountBidSide","toAmountAskSide","toAmountBothSide"]) if(typeof sdk[k]!=="function") throw Error("missing SDK helper "+k); for(const k of ["POSITION_MAX_LENGTH","MAX_BIN_LENGTH_ALLOWED_IN_ONE_TX","DEFAULT_BIN_PER_POSITION"]) if(sdk[k]==null) throw Error("missing SDK constant "+k); if(typeof DLMM?.create!=="function") throw Error("missing DLMM.create"); console.log("Direct ESM exports present; security and protocol acceptance still open")'
      - name: Test explicit ESM path and Anchor interoperability candidate in disposable installed copy
        if: ${{ always() && steps['direct-esm'].outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          cd research/live
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {createRequire} from 'node:module';
          import assert from 'node:assert/strict';
          const require=createRequire(import.meta.url);
          const file='node_modules/@meteora-ag/dlmm/dist/index.mjs';
          const original=readFileSync(file,'utf8');
          const sha=x=>createHash('sha256').update(x).digest('hex');
          let originalError;
          try{await import('@meteora-ag/dlmm')}catch(e){originalError=e}
          assert.equal(originalError?.code,'ERR_UNSUPPORTED_DIR_IMPORT');
          assert.ok(originalError.url.endsWith('/@coral-xyz/anchor/dist/cjs/utils/bytes'));
          const target='@coral-xyz/anchor/dist/cjs/utils/bytes';
          assert.ok(existsSync(require.resolve(target+'/index.js')));
          const literals=['"'+target+'"',"'"+target+"'"];
          const count=literals.reduce((n,v)=>n+original.split(v).length-1,0);
          assert.ok(count>0);
          assert.equal(sha(original),'bba1c677d6c66378f08f9b036b3e66bf42c99ee671bba6248b611299b3371cc0');
          const pathCandidate=literals.reduce((s,v)=>s.split(v).join(v.slice(0,-1)+'/index.js'+v.slice(-1)),original);
          assert.equal(sha(pathCandidate),'d1b524cf5079a4edfdeb2eaf117a401d4f4c776080ee76a6a89c3c5eb405e7b4');
          // Only named static imports from the confirmed CommonJS dependency.
          // Preserve local aliases emitted by the SDK bundler; reject unexpected syntax.
          const anchor=require('@coral-xyz/anchor'),anchorBindings=[];
          const alias='__dlmmCandidateAnchorCjs';
          assert.ok(!pathCandidate.includes(alias));
          const importPattern=/^[ \t]*import\s*\{([^{}]+)\}\s*from\s*(['"])@coral-xyz\/anchor\2[ \t]*;/gm;
          let importCount=0;
          const rewritten=pathCandidate.replace(importPattern,(full,specs)=>{
            importCount++;
            const bindings=specs.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{
              const m=/^([A-Za-z_$][\w$]*)(?:\s+as\s+([A-Za-z_$][\w$]*))?$/.exec(x);
              assert.ok(m,'Unexpected Anchor import specifier');
              assert.ok(Object.hasOwn(anchor,m[1]),'Missing Anchor CJS binding '+m[1]);
              const local=m[2]??m[1];
              anchorBindings.push({exported:m[1],local});
              return m[1]===local?local:m[1]+': '+local;
            });
            assert.ok(bindings.length>0);
            return 'const { '+bindings.join(', ')+' } = '+alias+';';
          });
          assert.ok(importCount>0&&anchorBindings.some(b=>b.exported==='BN'));
          const candidate='import '+alias+' from "@coral-xyz/anchor";\n'+rewritten;
          assert.equal(sha(candidate),'e32d73efe8fc2e25da01776f25fd7a980aa2574f54157d82a58fae2cae153b42');
          assert.equal(importCount,11);assert.equal(anchorBindings.length,13);
          const evidence={scope:'DISPOSABLE_ESM_PATH_AND_ANCHOR_CJS_CANDIDATE_ONLY',originalError:originalError.code,originalSha256:sha(original),pathCandidateSha256:sha(pathCandidate),candidateSha256:sha(candidate),replacementCount:count,anchorImportCount:importCount,anchorBindings,originalArtifactChanged:false,liveAcceptance:false,passed:false};
          const report='../../data/acceptance/sdk-esm-candidate.json';
          writeFileSync(report,JSON.stringify(evidence,null,2)+'\n');
          writeFileSync(file,candidate);
          try{
            // A fresh process is required after a failed ESM link. Run the child below.
            console.log(JSON.stringify(evidence));
          }catch(e){writeFileSync(file,original);throw e}
          JS
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {readFileSync,writeFileSync} from 'node:fs';
          const report='../../data/acceptance/sdk-esm-candidate.json';
          const evidence=JSON.parse(readFileSync(report,'utf8'));
          try{
            const esm=await import('@meteora-ag/dlmm'),require=createRequire(import.meta.url),cjs=require('@meteora-ag/dlmm');
            const {BN}=require('@coral-xyz/anchor');
            for(const k of ['createProgram','wrapPosition','getBinArrayIndexesCoverage','deriveBinArray','deriveBinArrayBitmapExtension','getBinArrayLowerUpperBinId','deriveEventAuthority','binIdToBinArrayIndex','toWeightDistribution','toAmountBidSide','toAmountAskSide','toAmountBothSide','positionV2Filter','positionLbPairFilter','positionOwnerFilter']){assert.equal(typeof esm[k],'function',k);assert.equal(typeof cjs[k],'function',k)}
            for(const k of ['POSITION_MAX_LENGTH','MAX_BIN_LENGTH_ALLOWED_IN_ONE_TX','DEFAULT_BIN_PER_POSITION']){assert.notEqual(esm[k],null,k);assert.equal(String(esm[k]),String(cjs[k]),k)}
            assert.equal(typeof esm.default.create,'function');
            for(const id of [-71,-70,-1,0,69,70]){const a=esm.binIdToBinArrayIndex(new BN(id)),b=cjs.binIdToBinArrayIndex(new BN(id));assert.equal(a.toString(),String(Math.floor(id/70)));assert.equal(a.toString(),b.toString());assert.deepEqual(esm.getBinArrayLowerUpperBinId(a).map(String),cjs.getBinArrayLowerUpperBinId(b).map(String))}
            evidence.passed=true;
          }catch(e){evidence.failureCode=e.code??e.name;evidence.failureMessage=e.message;process.exitCode=1}
          finally{writeFileSync(report,JSON.stringify(evidence,null,2)+'\n');console.log(JSON.stringify(evidence))}
          JS
      - name: Build source-level ESM repair candidate without replacing original lock
        if: ${{ always() && steps['consumer-install'].outcome == 'success' && steps['direct-esm'].outcome == 'failure' }}
        shell: bash
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          out="$root/data/acceptance/sdk-source-candidate"
          mkdir -p "$out"
          cd "$root/data/vendor/dlmm-sdk/ts-client"
          test -z "$(git status --porcelain)"
          node --input-type=module <<'JS'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createRequire} from 'node:module';
          import assert from 'node:assert/strict';
          const require=createRequire(import.meta.url);
          assert.equal(require('bn.js'),require('@coral-xyz/anchor').BN,'Source dependency BN constructor differs');
          function* files(dir){for(const e of readdirSync(dir,{withFileTypes:true})){const p=join(dir,e.name);if(e.isDirectory()){if(e.name!=='idl')yield* files(p)}else if(p.endsWith('.ts'))yield p}}
          const target='@coral-xyz/anchor/dist/cjs/utils/bytes';
          const changes=[];
          let pathCount=0,bnCount=0;
          for(const path of files('src/dlmm')){
            const old=readFileSync(path,'utf8');
            let next=old.replace(/import\s*\{([^{}]+)\}\s*from\s*(['"])@coral-xyz\/anchor\2\s*;/g,(full,body)=>{
              const names=body.split(',').map(x=>x.trim()).filter(Boolean);
              if(!names.includes('BN'))return full;
              assert.ok(!/import\s+BN\s+from/.test(old),'Existing default BN import '+path);
              bnCount++;
              const rest=names.filter(x=>x!=='BN');
              return 'import BN from "bn.js";'+(rest.length?'\nimport { '+rest.join(', ')+' } from "@coral-xyz/anchor";':'');
            });
            const from='"'+target+'"';
            if(next.includes(from)){pathCount+=next.split(from).length-1;next=next.split(from).join('"'+target+'/index.js"')}
            if(next!==old){writeFileSync(path,next);changes.push(path)}
          }
          assert.equal(pathCount,1);assert.ok(bnCount>0);
          console.log(JSON.stringify({scope:'SOURCE_REPAIR_CANDIDATE_ONLY',bnCount,pathCount,changes}));
          JS
          git diff --check
          git diff -- . > "$out/source.patch"
          test -s "$out/source.patch"
          pnpm run build
          npm pack --ignore-scripts --pack-destination "$out"
          candidate="$out/meteora-ag-dlmm-1.9.15.tgz"
          sha256sum "$candidate" > "$out/tarball.sha256"
          test "$(sha256sum "$root/data/vendor/meteora-ag-dlmm-1.9.15.tgz" | cut -d' ' -f1)" = 7e8da2ee2e528a5aba4c1efd3909dcd74ac94cfed380fa9636f256ade1a41b3b
          cd "$root/research/live"
          sdkdir=node_modules/@meteora-ag/dlmm
          cp "$sdkdir/dist/index.js" "$sdkdir/dist/original-reference.cjs"
          tar -xzf "$candidate" --strip-components=1 -C "$sdkdir"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const require=createRequire(import.meta.url);
          const file='node_modules/@meteora-ag/dlmm/dist/index.mjs';
          const report={scope:'SOURCE_REPAIR_CANDIDATE_ONLY',candidateEsmSha256:createHash('sha256').update(readFileSync(file)).digest('hex'),passed:false,liveAcceptance:false};
          try{
            const esm=await import('@meteora-ag/dlmm'),cjs=require('@meteora-ag/dlmm'),original=require('./node_modules/@meteora-ag/dlmm/dist/original-reference.cjs');
            const sdkRequire=createRequire(require.resolve('@meteora-ag/dlmm'));
            const {BN}=sdkRequire('@coral-xyz/anchor');
            assert.equal(sdkRequire('bn.js'),BN,'Consumer SDK BN constructor differs');
            for(const k of ['createProgram','wrapPosition','getBinArrayIndexesCoverage','deriveBinArray','deriveBinArrayBitmapExtension','getBinArrayLowerUpperBinId','deriveEventAuthority','binIdToBinArrayIndex','toWeightDistribution','toAmountBidSide','toAmountAskSide','toAmountBothSide','positionV2Filter','positionLbPairFilter','positionOwnerFilter']){
              for(const api of [esm,cjs,original])assert.equal(typeof api[k],'function',k)
            }
            for(const k of ['POSITION_MAX_LENGTH','MAX_BIN_LENGTH_ALLOWED_IN_ONE_TX','DEFAULT_BIN_PER_POSITION']){assert.notEqual(esm[k],null,k);assert.equal(String(esm[k]),String(original[k]),k);assert.equal(String(cjs[k]),String(original[k]),k)}
            assert.equal(typeof esm.default.create,'function');
            for(const id of [-71,-70,-1,0,69,70]){
              const index=original.binIdToBinArrayIndex(new BN(id));
              assert.equal(index.toString(),String(Math.floor(id/70)));
              for(const api of [esm,cjs]){
                const actual=api.binIdToBinArrayIndex(new BN(id));assert.equal(actual.toString(),index.toString());
                assert.deepEqual(api.getBinArrayLowerUpperBinId(actual).map(String),original.getBinArrayLowerUpperBinId(index).map(String));
              }
            }
            report.passed=true;
          }catch(e){report.failureCode=e.code??e.name;evidenceFailure(e);process.exitCode=1}
          finally{writeFileSync('../../data/acceptance/sdk-source-candidate/result.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report))}
          function evidenceFailure(e){report.failureMessage=e.message}
          JS
          git diff --exit-code -- package.json package-lock.json
      - name: Retain build identity evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-independent-build
          path: |
            data/acceptance/sdk-independent-build.json
            data/acceptance/sdk-esm-candidate.json
            data/acceptance/sdk-consumer-audit*.json
            data/acceptance/offline-*.json
            data/acceptance/terminal-process-smoke.*
            data/acceptance/sdk-source-candidate/source.patch
            data/acceptance/sdk-source-candidate/tarball.sha256
            data/acceptance/sdk-source-candidate/result.json
          if-no-files-found: warn
          retention-days: 7
